<section class="qrcode" id="qrcode">
  <div class="container py-5">
    <div class="logo text-center shadow-lg p-3 mt-4 rounded-4">
      <img loading="lazy" src="assets/images/tikecktImages/logos/tiecktat-logo-removebg-preview.png" alt="ticketat">
    </div>
    <div class="d-flex justify-content-center align-items-center">
      @if(book){
        @if(qr){
          @if (isUsed == false) {
            <div class="qr-wrapper">
              <qrcode
                [qrdata]="qrValue!"
                [width]="250"
                [margin]="1"
                colorDark="#222"
                colorLight="#fff"
                errorCorrectionLevel="M"
                ariaLabel="Scan to complete checkout">
              </qrcode>
            </div>
          } @else if(isUsed == true){
            <h2 class="mt-3 text-danger">❌ This QR has already been used</h2>
          }
        } @else {
          <h2 class="mt-3 text-danger">❌ QR not found</h2>
        }

      } @else {
        <h2 class="mt-3 text-danger">❌ No booking found</h2>
      }




      <!-- @if(book){
        <h2 class="mt-3 text-danger">❌ No booking found</h2>
      }

      @if(qr){
        <h2 class="mt-3 text-danger">❌ This QR not found</h2>
      } -->

    </div>
  </div>
</section>
