<section class="login d-flex justify-content-center align-items-center">
  <div class="container">
    <div class="card py-2 auth-card mx-auto">
      <div class="card-body">
        <!-- <app-logo-box className="mx-auto mb-4 text-center auth-logo" /> -->
        <div class="head-card d-flex flex-column justify-content-center align-items-center text-center gap-2 mb-3">
          <div class="head-image">
            <img src="assets/images/tikecktImages/logos/ticketat-logo-3.png" height="70" alt="logo dark" />
          </div>

          <div class="head-content">
            <h2 class="fw-bold text-uppercase fs-18 m-0">Sign In</h2>
            <p class="mb-0 mt-1">
              Enter your email address and password
            </p>
          </div>
        </div>

        <div class="px-4">
          <form class="authentication-form" [formGroup]="loginForm">
            <div class="mb-3">
              <label class="form-label" for="example-email">Email</label>
              <input
                type="email"
                id="example-email"
                formControlName="email"
                class="form-control bg-light bg-opacity-50 border-light py-2"
                placeholder="Enter your email"
              />
            </div>
            <div class="mb-3">
              <!-- <a
                routerLink="/forget-password"
                class="float-end text-muted text-unline-dashed ms-1"
                >Forget Password</a
              > -->
              <label class="form-label" for="password">Password</label>
              <input
                type="password"
                id="password"
                formControlName="password"

                class="form-control bg-light bg-opacity-50 border-light py-2"
                placeholder="Enter your password"
              />
            </div>
            <!-- <div class="mb-3">
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="checkbox-signin"
                />
                <label class="form-check-label" for="checkbox-signin"
                  >Remember me</label
                >
              </div>
            </div> -->

            <div class="mb-1 text-center d-grid">
              <button class="btn btn-danger py-2 fw-medium" type="submit" (click)="submitLogin()">
                Sign In
              </button>
            </div>
          </form>

          <!-- <p class="mb-0 mt-2 text-center">
            New here?

              >Sign Up</a
            >
          </p> -->

      </div>
    </div>
  </div>
