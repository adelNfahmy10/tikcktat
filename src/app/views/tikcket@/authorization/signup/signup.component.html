<div class="row justify-content-center">
  <div class="col-xl-5">
    <div class="card auth-card">
      <div class="card-body px-3 py-5">
        <app-logo-box className="mx-auto mb-4 text-center auth-logo" />

        <h2 class="fw-bold text-uppercase text-center fs-18">Free Account</h2>
        <p class="text-muted text-center mt-1 mb-4">
          New to our platform? Sign up now! It only takes a minute.
        </p>

        <div class="px-4">
          <form class="authentication-form" [formGroup]="registerForm" (ngSubmit)="submitRegisterForm()">
            <div class="mb-3">
              <label class="form-label" for="name">Name</label>
              <input
                type="name"
                formControlName="fullName"
                id="name"
                name="name"
                class="form-control bg-light bg-opacity-50 border-light py-2"
                placeholder="Enter your full name"
              />
            </div>

            <div class="mb-3">
              <label class="form-label" for="phone">Phone</label>
              <input
                type="tel"
                formControlName="mobile"
                id="phone"
                name="phone"
                class="form-control bg-light bg-opacity-50 border-light py-2"
                placeholder="Enter your phone"
              />
            </div>

            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input
                type="email"
                formControlName="email"
                id="email"
                name="email"
                class="form-control bg-light bg-opacity-50 border-light py-2"
                placeholder="Enter your email"
              />
            </div>

            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input
                type="password"
                formControlName="password"
                id="password"
                class="form-control bg-light bg-opacity-50 border-light py-2"
                placeholder="Enter your password"
              />
            </div>
            <!-- <div class="mb-3">
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="checkbox-signin"
                />
                <label class="form-check-label" for="checkbox-signin"
                  >I accept Terms and Condition</label
                >
              </div>
            </div> -->

            <div class="mb-1 text-center d-grid">
              <button class="btn main-btn py-2" type="submit">
                Create Account
              </button>
            </div>
          </form>

          <p class="mb-0 mt-2 text-center">
            I already have an account ?
            <a
              routerLink="/login"
              class="main-color fw-bold"
              >Sign In</a
            >
          </p>

      </div>
    </div>


  </div>
</div>
