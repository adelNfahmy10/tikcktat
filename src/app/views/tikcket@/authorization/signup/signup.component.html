<section class="register d-flex align-items-center justify-content-center">
  <div class="container">
    <div class="card py-2 auth-card mx-auto">
      <div class="card-body">
        <!-- <app-logo-box className="mx-auto mb-4 text-center auth-logo" /> -->
        <div class="head-card d-flex flex-column justify-content-center align-items-center text-center gap-2 mb-3">
          <div class="head-image">
            <img src="assets/images/tikecktImages/logos/mini-icon.png" height="70" alt="logo dark" />
          </div>

          <div class="head-content">
            <h2 class="fw-bold text-uppercase fs-18 m-0">Free Account</h2>
            <p class="mb-0 mt-1">
              New to our platform? Sign up now! It only takes a minute.
            </p>
          </div>
        </div>

        <div class="px-4">
          <form class="authentication-form" [formGroup]="registerForm" (ngSubmit)="submitRegisterForm()" >
            <!-- ROLE -->
            <div class="mb-3">
              <label class="form-label" for="role">Role</label>

              <select class="form-control bg-light bg-opacity-50 border-light py-2" id="role" formControlName="role">
                <option value="" disabled>Choose Role</option>
                @for (role of allRoles; track $index) {
                  <option [value]="role">{{ role }}</option>
                }
              </select>
            </div>

            <!-- FULL NAME -->
            <div class="mb-3">
              <label class="form-label" for="name">Name</label>
              <input
                type="text"
                id="name"
                formControlName="fullName"
                class="form-control bg-light bg-opacity-50 border-light py-2"
                placeholder="Enter your full name"
              />
            </div>

            <!-- PHONE -->
            <div class="mb-3">
              <label class="form-label" for="phone">Phone</label>
              <input
                type="tel"
                id="phone"
                formControlName="phone"
                class="form-control bg-light bg-opacity-50 border-light py-2"
                placeholder="Enter your phone"
              />
            </div>

            <!-- EMAIL -->
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input
                type="email"
                id="email"
                formControlName="email"
                class="form-control bg-light bg-opacity-50 border-light py-2"
                placeholder="Enter your email"
              />
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input
                type="password"
                id="password"
                formControlName="password"
                class="form-control bg-light bg-opacity-50 border-light py-2"
                placeholder="Enter your password"
              />
            </div>

            <!-- SUBMIT -->
            <div class="mb-1 text-center d-grid">
              <button class="btn main-btn py-2" type="submit">
                Create Account
              </button>
            </div>

          </form>

      </div>
    </div>
  </div>
</section>
