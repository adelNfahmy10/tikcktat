<section class="checkout" id="checkout">
  <div class="container-fluid py-3">
    <div class="bg-white rounded-3 p-3">
      <div class="row g-3">
        <div class="col-md-7">
          <div class="image-event">
            <img src="assets/images/tikecktImages/home-image/bg-home.png" class="w-100 rounded-4" alt="">
          </div>
        </div>

        <div class="col-md-5">
          <form class="d-flex flex-column gap-2 p-2 shadow-lg rounded-3" [formGroup]="checkoutForm">
            <h1 class="main-color fw-bold">Checkout Event</h1>
            <div class="fullName">
              <label for="photo" class="form-label">Photo</label>
              <input
                class="form-control"
                type="file"
                id="Photo"
                accept="image/*"
                (change)="onPhotoChange($event)"
              >

              @if (photoPreview) {
                <!-- Preview -->
                <img
                  [src]="photoPreview"
                  alt="preview"
                  style="width:200px; margin-top:10px"
                />
              }
            </div>


            <div class="FullName">
              <label for="FullName" class="form-label">Full Name</label>
              <input class="form-control" formControlName="FullName" type="text" name="FullName" id="FullName" placeholder="Enter Your Full Name...">
            </div>

            <div class="Phone">
              <label for="Phone" class="form-label">Phone</label>
              <input class="form-control" formControlName="Phone" type="tel" name="Phone" id="Phone" placeholder="Enter Your Phone...">
            </div>

            <div class="Email">
              <label for="Email" class="form-label">Email</label>
              <input class="form-control" formControlName="Email" type="Email" name="Email" id="Email" placeholder="Enter Your Email...">
            </div>

            <div class="VisitorCount">
              <label for="VisitorCount" class="form-label">Visitor</label>
              <input class="form-control" formControlName="VisitorCount" type="number" name="VisitorCount" id="VisitorCount" placeholder="Enter Your Visitor Count...">
            </div>

            <div class="submit-btn text-center">
              <button class="btn btn-bg" (click)="submitCheckout()"> Checkout </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
